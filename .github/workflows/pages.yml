name: Deploy to GitHub Pages
on:
  push:
    branches: [main, master, claude/spunki-game-clone-4td8po]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage site
        run: |
          mkdir _site
          cp -r index.html style.css config.js audio.js sounds.js art.js progress.js cloud.js scene.js game.js sw.js manifest.webmanifest icons music _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
